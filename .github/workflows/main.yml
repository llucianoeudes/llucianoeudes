name: Generate Snake Animation

on:
  schedule:
    # Roda automaticamente a cada 24 horas
    - cron: "0 */24 * * *"
  
  # Permite executar manualmente
  workflow_dispatch:
  
  # Roda a cada push na branch main/master
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Generate Snake Game Animation
        uses: Platane/snk@v3
        with:
          github_user_name: llucianoeudes  # Substitua se necessário
          outputs: |
            dist/github-contribution-grid-snake.svg?color=FFA500
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color=FFA500
          # Opções extras (opcional)
          circle_radius: 6          # Tamanho dos "blocos" da cobra
          period_days: 31           # Dias mostrados na animação

      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
